name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov requests beautifulsoup4 'pywikibot>=11.6'

      - name: Run tests with coverage
        run: pytest -v --cov=upload --cov-report=xml:coverage.xml --cov-report=term-missing
