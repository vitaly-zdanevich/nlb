name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        pywikibot: ['pywikibot==11.6.0', 'pywikibot>=11.6']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov requests beautifulsoup4 '${{ matrix.pywikibot }}' 'pypdf>=6,<7' mwparserfromhell

      - name: Run tests with coverage
        run: pytest -v --cov=upload --cov=viewer_outline --cov=wikimedia_text --cov=catalog_hierarchy --cov=metadata_refresh --cov=metadata_refresh_merge --cov=scan_identity --cov=commons_verification --cov=catalog_requests --cov=catalog_validation --cov=preservation --cov=publication_rights --cov=pdf_validation --cov=reconcile_metadata --cov-report=xml:coverage.xml --cov-report=term-missing
